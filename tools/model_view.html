<!doctype html>
<html><head><meta charset="utf-8"><title>model preview</title>
<style>html,body{margin:0;background:#3a3d40;overflow:hidden;font:12px monospace;color:#fff}#i{position:fixed;left:6px;top:6px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="i"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const r = new THREE.WebGLRenderer({antialias: true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.DirectionalLight(0xffffff, 2).translateY(2).translateZ(1).translateX(1));
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.001, 100);
window.__load = (url) => new Promise(res => new GLTFLoader().load(url, (g) => {
  if (window.__cur) scene.remove(window.__cur);
  const o = g.scene; scene.add(o); window.__cur = o;
  const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
  const d = Math.max(s.x, s.y, s.z);
  cam.position.copy(c).add(new THREE.Vector3(d * 1.2, d * 0.8, d * 1.6)); cam.near = d / 100; cam.far = d * 20; cam.lookAt(c); cam.updateProjectionMatrix();
  let tris = 0; o.traverse(m => { if (m.isMesh) tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
  const info = {size: s.toArray().map(v => +v.toFixed(3)), center: c.toArray().map(v => +v.toFixed(3)), tris: Math.round(tris)};
  document.getElementById('i').textContent = url + '  ' + JSON.stringify(info); res(JSON.stringify(info));
}));
(function f() { requestAnimationFrame(f); r.render(scene, cam); })();
window.__camAt = (dx, dy, dz) => { const b = new THREE.Box3().setFromObject(window.__cur), c = b.getCenter(new THREE.Vector3()), d = b.getSize(new THREE.Vector3()).length(); cam.position.copy(c).add(new THREE.Vector3(dx, dy, dz).multiplyScalar(d * 1.4)); cam.up.set(0, 1, 0); if (Math.abs(dy) > 0.9) cam.up.set(0, 0, -1); cam.lookAt(c); return 1; };
window.__cam = cam; window.__THREE = THREE; window.__scene = scene;
window.__look = (px, py, pz, tx, ty, tz, fov = 60) => { cam.position.set(px, py, pz); cam.fov = fov; cam.near = 0.01; cam.far = 1000; cam.up.set(0, 1, 0); cam.lookAt(tx, ty, tz); cam.updateProjectionMatrix(); return 1; };
window.__ready = true;
</script></body></html>
